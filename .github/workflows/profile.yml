name: Update Profile README

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

env:
  USER: manthansharma17
  THEME: hide_border=true&bg_color=0A0A0A&title_color=E3162B&icon_color=E3162B&text_color=BFBFBF&ring_color=E3162B

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ env.USER }}&show_icons=true&include_all_commits=true&rank_icon=github&${{ env.THEME }}
          path: assets/cards/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ env.USER }}&layout=compact&langs_count=8&${{ env.THEME }}
          path: assets/cards/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin AuraSnap
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ env.USER }}&repo=AuraSnap&${{ env.THEME }}
          path: assets/cards/pin-AuraSnap.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin dogthreejs
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ env.USER }}&repo=dogthreejs&${{ env.THEME }}
          path: assets/cards/pin-dogthreejs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin airodynamic-clone
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ env.USER }}&repo=airodynamic-clone&${{ env.THEME }}
          path: assets/cards/pin-airodynamic-clone.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin components
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ env.USER }}&repo=components&${{ env.THEME }}
          path: assets/cards/pin-components.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin AI lab
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ env.USER }}&repo=IC-2K23-58_AI_ManthanSharma&${{ env.THEME }}
          path: assets/cards/pin-ai-lab.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin portfolio
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ env.USER }}&repo=manthan_portfolio&${{ env.THEME }}
          path: assets/cards/pin-portfolio.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update stats cards
          file_pattern: assets/cards/*.svg

  activity:
    needs: stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: Update recent activity
          MAX_LINES: 6

  space-shooter:
    needs: activity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2
      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: assets/space-shooter.gif
          strategy: random
          fps: "30"
          no-amend: "true"
          commit-message: Update space shooter game
